name: Distribute to phone

# On every push to nena-watch-bridge: build the embedded-VPN debug APK (Go core +
# Gradle, same toolchain as android.yml) + run its tests, then ship the build to
# your phone via Firebase App Distribution (fastlane). Your phone gets a
# notification in the "App Tester" app / an install email — no Tailscale, no USB,
# no self-hosted runner. The automated gate here is "build + tests pass"; the
# on-device check (does watch discovery/pair/connect/pull actually work) is
# manual once the build lands on the phone.
#
# One-time Firebase + tester setup and the secrets/variables below:
# scripts/ci/README.md (mirrors Hogozat's own setup doc)
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   secret   FIREBASE_TOKEN           Firebase CLI token from `firebase login:ci`
#                                      (service-account keys are blocked by org policy)
#   variable FIREBASE_TESTER_EMAILS   your email (no group needed), OR
#   variable FIREBASE_TESTER_GROUPS   a group alias like "testers" (fallback)

on:
  push:
    branches: ["nena-watch-bridge"]
  workflow_dispatch:

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build + distribute (Firebase App Distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby + fastlane (bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build + distribute to testers
        env:
          # Forces plain module mode for the embedded Go core's build (./tool/go run
          # tailscale.com/cmd/mkversion, invoked by `make tailscale-debug.apk`).
          # This repo has no vendor/ directory at all, but the CI runner was
          # observed going into vendor mode anyway (likely inherited from
          # actions/setup-go's own environment/cache) and failing with "explicitly
          # required in go.mod, but not marked as explicit in vendor/modules.txt" -
          # confirmed NOT reproducible locally, so this is CI-environment-specific.
          GOFLAGS: -mod=mod
          # Firebase CLI token (service-account keys are blocked by org policy).
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Set EITHER FIREBASE_TESTER_EMAILS (comma-separated, no group needed) OR
          # FIREBASE_TESTER_GROUPS. Emails win if both are set; default group "testers".
          FIREBASE_TESTER_EMAILS: ${{ vars.FIREBASE_TESTER_EMAILS }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Secret FIREBASE_TOKEN is not set. Generate it with 'firebase login:ci'."
            exit 1
          fi
          bundle exec fastlane distribute
